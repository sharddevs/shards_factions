plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.1.0-SNAPSHOT'
group = 'com.sharddevs'

base {
    archivesName = 'shards_factions'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.230'

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        shards_factions {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'TrevorGoldenMaven'
        url = 'https://maven.trevorgolden.com/releases'
        credentials {
            username = project.findProperty('mavenTrevorUsername') ?: ''
            password = project.findProperty('mavenTrevorPassword') ?: ''
        }
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenLocal()
}

dependencies {
    // v1 of shards_factions is a standalone mod — no compile-time
    // dependency on other mods. Upstream mod deps will be added here
    // only if a later phase needs to reference their types.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title':      'shards_factions',
                'Specification-Vendor':     'sharddevs',
                'Specification-Version':    '1',
                'Implementation-Title':     project.name,
                'Implementation-Version':   project.version,
                'Implementation-Vendor':    'sharddevs',
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'shards_factions'
        }
    }
    repositories {
        maven {
            name = 'TrevorGoldenMaven'
            url = 'https://maven.trevorgolden.com/releases'
            credentials {
                username = project.findProperty('mavenTrevorUsername') ?: ''
                password = project.findProperty('mavenTrevorPassword') ?: ''
            }
        }
    }
}
